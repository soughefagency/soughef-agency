<header class="topbar">
  <div class="container nav">
    <a
      class="brand"
      href="#accueil"
      [attr.aria-label]="config.brand.fullName + ', accueil'"
      (click)="closeMenu()"
    >
      <span class="brand-mark" aria-hidden="true">
        <img [src]="config.logos.mark" alt="" />
      </span>
      <span class="brand-name"
        >{{ config.brand.name }}<span class="brand-sub">{{ config.brand.subName }}</span></span
      >
    </a>
    <button
      class="menu-toggle"
      [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="navLinks"
      (click)="toggleMenu()"
    >
      {{ menuOpen() ? '×' : '☰' }}
    </button>
    <nav
      id="navLinks"
      class="nav-links"
      [class.open]="menuOpen()"
      aria-label="Navigation principale"
    >
      @for (link of links; track link.href) {
        <a
          [href]="link.href"
          [class.active]="isActive(link.href)"
          [attr.aria-current]="isActive(link.href) ? 'true' : null"
          (click)="closeMenu()"
          >{{ link.label }}</a
        >
      }
    </nav>
    <a class="btn" href="#contact">Contactez-nous <span aria-hidden="true">↗</span></a>
  </div>
</header>
