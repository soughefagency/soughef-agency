<section class="hero" id="accueil">
  <div class="container">
    <div class="hero-content">
      <p class="eyebrow">{{ t().hero.eyebrow }}</p>
      <h1>
        {{ config.brand.name }} <span>{{ config.brand.subName }}</span>
      </h1>
      <p class="hero-lead">
        {{ t().hero.lead }}
      </p>
      <div class="service-line" [attr.aria-label]="t().hero.eyebrow">
        @for (domain of t().hero.domains; track domain) {
          <span>{{ domain }}</span>
        }
      </div>
      <div class="hero-actions">
        <a class="btn" href="#services">{{ t().hero.ctaPrimary }} <span aria-hidden="true">→</span></a>
        <a class="btn btn-outline" href="#contact">{{ t().hero.ctaSecondary }}</a>
      </div>
    </div>
  </div>
</section>
