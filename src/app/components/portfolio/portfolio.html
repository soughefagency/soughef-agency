<section id="portfolio">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">Nos réalisations</p>
      <h2>Des idées transformées en expériences digitales</h2>
      <p>Découvrez quelques exemples de projets représentatifs de nos domaines de compétence.</p>
    </div>
    <div class="portfolio-grid">
      @for (project of projects; track project.title) {
        <article class="project">
          <div
            class="project-image"
            role="img"
            [attr.aria-label]="project.alt"
            [style.background-image]="'url(' + project.image + ')'"
          ></div>
          <div class="project-info">
            <span class="project-tag">{{ project.tag }}</span>
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
