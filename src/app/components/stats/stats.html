
<section class="stats" aria-labelledby="stats-title">
  <div class="container">
    <div class="stats-head">
      <p class="eyebrow">Nos engagements</p>
      <h2 id="stats-title">Une collaboration pensée pour vous</h2>
    </div>

    <ul class="stats-grid">
      @for (stat of stats; track stat.value) {
        <li class="stat">
          <span class="stat-icon" aria-hidden="true">
            @switch (stat.key) {
              @case ('tailored') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round">
                  <line x1="3" y1="6" x2="21" y2="6" />
                  <line x1="3" y1="12" x2="21" y2="12" />
                  <line x1="3" y1="18" x2="21" y2="18" />
                  <circle cx="8" cy="6" r="2.3" fill="currentColor" stroke="none" />
                  <circle cx="16" cy="12" r="2.3" fill="currentColor" stroke="none" />
                  <circle cx="9" cy="18" r="2.3" fill="currentColor" stroke="none" />
                </svg>
              }
              @case ('services') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7" rx="1.6" />
                  <rect x="14" y="3" width="7" height="7" rx="1.6" />
                  <rect x="3" y="14" width="7" height="7" rx="1.6" />
                  <rect x="14" y="14" width="7" height="7" rx="1.6" />
                </svg>
              }
              @case ('support') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9" />
                  <circle cx="12" cy="12" r="3.2" />
                  <line x1="5.6" y1="5.6" x2="9.7" y2="9.7" />
                  <line x1="14.3" y1="14.3" x2="18.4" y2="18.4" />
                  <line x1="18.4" y1="5.6" x2="14.3" y2="9.7" />
                  <line x1="9.7" y1="14.3" x2="5.6" y2="18.4" />
                </svg>
              }
              @case ('global') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9" />
                  <line x1="3" y1="12" x2="21" y2="12" />
                  <path d="M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9z" />
                </svg>
              }
            }
          </span>
          <strong>{{ stat.value }}</strong>
          <span class="stat-label">{{ stat.label }}</span>
        </li>
      }
    </ul>
  </div>
</section>
